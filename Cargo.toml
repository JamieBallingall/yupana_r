[workspace]
resolver = "3"
members = ["crates/yup-core", "crates/yup-cli", "crates/yup-wasm", "crates/yup-bundle"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# The WebAssembly module, as small as it can be made:
# `cargo build -p yup-wasm --target wasm32-unknown-unknown --profile wasm`.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
